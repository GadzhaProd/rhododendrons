# Publishes a shareable, read-only preview of the site to GitHub Pages:
# https://gadzhaprod.github.io/rhododendrons/
#
# Pages serves static files only, so this build differs from production:
#   - next.config.mjs switches to output: "export" (STATIC_EXPORT)
#   - app/api/* is dropped — route handlers need a Node server
#   - NEXT_PUBLIC_DEMO_MODE makes the three forms confirm without sending mail
#   - robots.txt disallows everything, so the preview never competes with
#     toprhododendrons.nl in search results
#
# None of this affects `npm run dev` or a normal production deploy.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STATIC_EXPORT: 'true'
      NEXT_PUBLIC_BASE_PATH: /rhododendrons
      NEXT_PUBLIC_DEMO_MODE: 'true'
      NEXT_PUBLIC_SITE_URL: https://gadzhaprod.github.io/rhododendrons
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # public/images holds 17-21 MB camera originals and images.unoptimized
      # is on, so visitors would download the full files. Shrink the copies in
      # this checkout only — the repository keeps the originals.
      - name: Shrink oversized images for the preview
        run: |
          if command -v magick >/dev/null 2>&1; then
            convert_cmd="magick"
          elif command -v convert >/dev/null 2>&1; then
            convert_cmd="convert"
          else
            echo "ImageMagick not available — deploying full-size images."
            exit 0
          fi
          find public/images -type f -size +2M \
            \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print0 |
            while IFS= read -r -d '' f; do
              before=$(du -h "$f" | cut -f1)
              "$convert_cmd" "$f" -auto-orient -resize '2000x2000>' -quality 82 -strip "$f"
              echo "  $f: $before -> $(du -h "$f" | cut -f1)"
            done
          echo "public/images is now $(du -sh public/images | cut -f1)"

      # Route handlers (POST, nodemailer) cannot be statically exported.
      - name: Drop server-only API routes
        run: rm -rf app/api

      - run: npm run build

      # Stop GitHub Pages' Jekyll pass from hiding _next/.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
